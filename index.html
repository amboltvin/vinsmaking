<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinkartotek</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: linear-gradient(135deg, #faf5f0 0%, #f3f4f6 100%);
      min-height: 100vh; 
      padding: 1rem;
    }
    .debug { position: fixed; bottom: 1rem; right: 1rem; background: white; border: 2px solid red; padding: 0.5rem; max-width: 250px; font-size: 0.65rem; max-height: 150px; overflow-y: auto; z-index: 9999; }
    .container { max-width: 80rem; margin: 0 auto; }
    .card { background: white; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 1rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; font-family: inherit; }
    .btn-primary { background: #374151; color: white; }
    .btn-gray { background: #d1d5db; color: #374151; }
    .btn-blue { background: #2563eb; color: white; }
    input, select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-size: 0.875rem; font-family: inherit; margin-bottom: 0.5rem; }
    .flex { display: flex; gap: 0.5rem; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .space-y > * + * { margin-top: 0.5rem; }
    .hidden { display: none !important; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; overflow: auto; }
    .modal-content { background: white; border-radius: 0.5rem; max-width: 40rem; width: 100%; box-shadow: 0 20px 25px rgba(0,0,0,0.15); overflow-y: auto; }
    .modal-header { padding: 1rem; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 1rem; }
    .modal-footer { padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; flex-direction: column; }
    .wine-card { background: white; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; cursor: pointer; transition: all 0.2s; margin-bottom: 0.5rem; }
    .wine-card:hover { box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
    .wine-name { font-weight: bold; margin-bottom: 0.25rem; }
    .wine-meta { font-size: 0.75rem; color: #6b7280; }
    .stars { font-weight: bold; }
    .tab-btn { padding: 0.5rem 1rem; border: none; cursor: pointer; border-radius: 0.375rem; font-family: inherit; background: #d1d5db; color: #374151; }
    .tab-active { background: #374151; color: white; }
  </style>
</head>
<body>
  <div id="debug" class="debug">
    <strong>DEBUG:</strong>
    <div id="debugLog" style="font-size: 0.6rem;"></div>
  </div>

  <div class="container">
    <div class="card">
      <div class="flex-between">
        <h1>🗂 Vinkartotek</h1>
        <div class="flex">
          <button class="btn-primary" id="addBtn">+</button>
          <button class="btn-primary" id="refreshBtn">↻</button>
        </div>
      </div>
      
      <div class="flex" style="margin-bottom: 1rem;">
        <button class="tab-btn tab-active" id="tabList">Utforsk</button>
        <button class="tab-btn" id="tabStats">Statistikk</button>
      </div>

      <div id="listView">
        <div class="space-y" style="margin-bottom: 1rem;">
          <input type="text" id="searchInput" placeholder="Søk..." />
          <div class="grid-3">
            <select id="filterType">
              <option value="">Alle typer</option>
              <option value="Rødvin">Rødvin</option>
              <option value="Hvitvin">Hvitvin</option>
              <option value="Rosévin">Rosévin</option>
            </select>
            <select id="filterQuality">
              <option value="">Alle stjerner</option>
            </select>
            <select id="sortBy">
              <option value="newest">Nyeste først</option>
              <option value="quality">Kvalitet</option>
            </select>
          </div>
          <select id="filterCountry">
            <option value="">Alle land</option>
          </select>
          <button class="btn-gray" id="resetBtn">Nullstill</button>
        </div>
      </div>

      <div id="statsView" class="hidden">
        <div class="space-y">
          <div style="background: #f0f0f0; padding: 1rem; border-radius: 0.5rem;">
            <div style="font-size: 2rem; font-weight: bold; color: #374151;">1706</div>
            <div style="font-size: 0.875rem; color: #6b7280;">Totalt viner</div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div style="background: #f0f0f0; padding: 1rem; border-radius: 0.5rem;">
              <div style="font-size: 1.5rem; font-weight: bold; color: #374151;" id="statCountries">-</div>
              <div style="font-size: 0.875rem; color: #6b7280;">Land</div>
            </div>
            <div style="background: #f0f0f0; padding: 1rem; border-radius: 0.5rem;">
              <div style="font-size: 1.5rem; font-weight: bold; color: #374151;" id="statTypes">-</div>
              <div style="font-size: 0.875rem; color: #6b7280;">Typer vin</div>
            </div>
          </div>
          <div id="topCountries" style="background: #f0f0f0; padding: 1rem; border-radius: 0.5rem;">
            <h3>Topp 10 land</h3>
            <div id="topCountriesList" style="font-size: 0.875rem; margin-top: 0.5rem;"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="wineList"></div>
  </div>

  <div id="detailsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="detailsName"></h2>
        <button style="background: none; border: none; font-size: 1.5rem; cursor: pointer;" id="closeDetailsBtn">×</button>
      </div>
      <div class="modal-body" id="detailsBody"></div>
      <div class="modal-footer">
        <button class="btn-blue" id="editBtn">✎ Rediger</button>
        <button class="btn-gray">Lukk</button>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1QagDAoCbeuAneC0H37PhIVncqUxIslH8lrchBgyfhnA';
    let wines = [];
    let selectedWine = null;

    function debug(msg) {
      const log = document.getElementById('debugLog');
      const line = document.createElement('div');
      line.textContent = msg;
      log.appendChild(line);
      if (log.children.length > 10) log.removeChild(log.firstChild);
    }

    debug('Started');

    const formatDate = (dateValue) => {
      if (!dateValue) return '';
      // Handle Date objects from Google Sheets
      if (dateValue instanceof Date) {
        const year = dateValue.getFullYear();
        const month = String(dateValue.getMonth() + 1).padStart(2, '0');
        const day = String(dateValue.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      // Handle strings
      if (typeof dateValue === 'string' && dateValue.includes('-')) return dateValue;
      return dateValue;
    };

    const toNorwegianDate = (dateString) => {
      if (!dateString) return '';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}.${month}.${year}`;
    };

    const loadData = async () => {
      debug('Loading data...');
      try {
        const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
        const t = await r.text();
        const j = JSON.parse(t.substring(47).slice(0, -2));
        
        wines = j.table.rows.map((row, i) => {
          let qualityValue = '';
          if (row.c[20]?.v !== null && row.c[20]?.v !== undefined) {
            qualityValue = String(row.c[20].v);
            if (qualityValue.startsWith("'")) qualityValue = qualityValue.substring(1);
          }
          return {
            id: i + 1,
            name: row.c[0]?.v || '',
            url: row.c[1]?.v || '',
            wineType: row.c[2]?.v || '',
            dateTasted: formatDate(row.c[3]?.v) || '',
            country: row.c[4]?.v || '',
            region: row.c[5]?.v || '',
            subRegion: row.c[6]?.v || '',
            grapes: row.c[7]?.v || '',
            quality: qualityValue
          };
        });
        
        debug('Loaded ' + wines.length + ' wines');
        updateFilters();
        render();
      } catch (e) {
        debug('Error: ' + e.message);
      }
    };

    const updateFilters = () => {
      const qualities = [...new Set(wines.map(w => w.quality).filter(Boolean))].sort((a, b) => parseFloat(b) - parseFloat(a));
      const countries = [...new Set(wines.map(w => w.country).filter(Boolean))].sort();
      
      document.getElementById('filterQuality').innerHTML = '<option value="">Alle stjerner</option>' + 
        qualities.map(q => `<option value="${q}">${q}★</option>`).join('');
      
      document.getElementById('filterCountry').innerHTML = '<option value="">Alle land</option>' + 
        countries.map(c => `<option value="${c}">${c}</option>`).join('');
    };

    const render = () => {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const type = document.getElementById('filterType').value;
      const quality = document.getElementById('filterQuality').value;
      const country = document.getElementById('filterCountry').value;
      const sort = document.getElementById('sortBy').value || 'newest';
      
      let filtered = wines.filter(w => {
        const matchSearch = Object.values(w).some(v => String(v).toLowerCase().includes(search));
        const matchType = !type || w.wineType === type;
        const matchQuality = !quality || w.quality === quality;
        const matchCountry = !country || w.country === country;
        return matchSearch && matchType && matchQuality && matchCountry;
      });

      if (sort === 'newest') {
        filtered.sort((a, b) => {
          const dateA = new Date(a.dateTasted || 0);
          const dateB = new Date(b.dateTasted || 0);
          if (dateB.getTime() !== dateA.getTime()) return dateB - dateA;
          return b.id - a.id;
        });
      } else if (sort === 'quality') {
        filtered.sort((a, b) => parseFloat(b.quality || 0) - parseFloat(a.quality || 0));
      }

      const list = document.getElementById('wineList');
      list.innerHTML = '';
      
      filtered.forEach(w => {
        const card = document.createElement('div');
        card.className = 'wine-card';
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'wine-name';
        nameDiv.textContent = w.name;
        
        const metaDiv = document.createElement('div');
        metaDiv.className = 'wine-meta';
        metaDiv.textContent = `${w.wineType} · ${w.country} · ${toNorwegianDate(w.dateTasted)}`;
        
        const actionDiv = document.createElement('div');
        actionDiv.className = 'flex-between';
        actionDiv.style.marginTop = '0.5rem';
        
        const starsSpan = document.createElement('span');
        starsSpan.className = 'stars';
        starsSpan.textContent = w.quality ? w.quality + '★' : '';
        
        actionDiv.appendChild(starsSpan);
        
        if (w.url) {
          const link = document.createElement('a');
          link.href = w.url;
          link.target = '_blank';
          link.textContent = '🔗';
          link.style.textDecoration = 'none';
          actionDiv.appendChild(link);
        }
        
        card.appendChild(nameDiv);
        card.appendChild(metaDiv);
        card.appendChild(actionDiv);
        
        card.onclick = () => {
          selectedWine = w;
          document.getElementById('detailsName').textContent = w.name;
          
          const body = document.getElementById('detailsBody');
          body.innerHTML = '';
          if (w.wineType) body.innerHTML += `<p><strong>Type:</strong> ${w.wineType}</p>`;
          if (w.dateTasted) body.innerHTML += `<p><strong>Dato smakt:</strong> ${toNorwegianDate(w.dateTasted)}</p>`;
          if (w.country) body.innerHTML += `<p><strong>Land:</strong> ${w.country}</p>`;
          if (w.region) body.innerHTML += `<p><strong>Region:</strong> ${w.region}</p>`;
          if (w.subRegion) body.innerHTML += `<p><strong>Underregion:</strong> ${w.subRegion}</p>`;
          if (w.grapes) body.innerHTML += `<p><strong>Druer:</strong> ${w.grapes}</p>`;
          if (w.quality) body.innerHTML += `<p><strong>Kvalitet:</strong> ${w.quality}★</p>`;
          if (w.url) body.innerHTML += `<p><a href="${w.url}" target="_blank">🔗 Åpne vin</a></p>`;
          
          document.getElementById('detailsModal').classList.remove('hidden');
        };
        
        list.appendChild(card);
      });
    };

    // Event listeners
    // Event listeners
    document.getElementById('closeDetailsBtn').addEventListener('click', () => {
      document.getElementById('detailsModal').classList.add('hidden');
    });

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('filterType').addEventListener('change', render);
    document.getElementById('filterQuality').addEventListener('change', render);
    document.getElementById('sortBy').addEventListener('change', render);
    document.getElementById('filterCountry').addEventListener('change', render);
    
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterType').value = '';
      document.getElementById('filterQuality').value = '';
      document.getElementById('filterCountry').value = '';
      document.getElementById('sortBy').value = 'newest';
      render();
    });

    document.getElementById('tabList').addEventListener('click', () => {
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('statsView').classList.add('hidden');
      document.getElementById('tabList').classList.add('tab-active');
      document.getElementById('tabStats').classList.remove('tab-active');
    });

    document.getElementById('tabStats').addEventListener('click', () => {
      document.getElementById('listView').classList.add('hidden');
      document.getElementById('statsView').classList.remove('hidden');
      document.getElementById('tabStats').classList.add('tab-active');
      document.getElementById('tabList').classList.remove('tab-active');
      updateStats();
    });

    const updateStats = () => {
      const countries = [...new Set(wines.map(w => w.country).filter(Boolean))];
      const types = [...new Set(wines.map(w => w.wineType).filter(Boolean))];
      
      document.getElementById('statCountries').textContent = countries.length;
      document.getElementById('statTypes').textContent = types.length;
      
      // Top 10 countries
      const countryStats = {};
      wines.forEach(w => {
        if (w.country) {
          if (!countryStats[w.country]) countryStats[w.country] = { count: 0, totalQuality: 0 };
          countryStats[w.country].count++;
          if (w.quality) countryStats[w.country].totalQuality += parseFloat(w.quality);
        }
      });
      
      const topCountries = Object.entries(countryStats)
        .map(([country, stats]) => ({
          country,
          count: stats.count,
          avg: (stats.totalQuality / stats.count).toFixed(1)
        }))
        .sort((a, b) => b.avg - a.avg)
        .slice(0, 10);
      
      const countriesList = document.getElementById('topCountriesList');
      countriesList.innerHTML = topCountries.map(c => 
        `<div>${c.country}: ${c.avg}★ (${c.count} viner)</div>`
      ).join('');
    };

    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('addBtn').addEventListener('click', () => debug('Add clicked'));

    loadData();
  </script>
</body>
</html>
