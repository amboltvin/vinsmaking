<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinkartotek</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: linear-gradient(135deg, #faf5f0 0%, #f3f4f6 100%);
      min-height: 100vh; 
      padding: 1rem;
    }
    .debug { position: fixed; bottom: 1rem; right: 1rem; background: white; border: 2px solid red; padding: 1rem; max-width: 300px; font-size: 0.75rem; max-height: 200px; overflow-y: auto; z-index: 9999; }
    .container { max-width: 80rem; margin: 0 auto; }
    .card { 
      background: white; 
      border-radius: 0.5rem; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
      padding: 1rem; 
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; }
    h2 { font-size: 1.1rem; font-weight: bold; margin: 1rem 0 0.5rem; }
    button { 
      padding: 0.5rem 1rem; 
      border: none; 
      border-radius: 0.375rem; 
      cursor: pointer; 
      font-size: 0.875rem; 
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary { background: #374151; color: white; }
    .btn-secondary { background: #6b7280; color: white; }
    .btn-gray { background: #d1d5db; color: #374151; }
    input, select { 
      width: 100%; 
      padding: 0.5rem; 
      border: 1px solid #d1d5db; 
      border-radius: 0.375rem; 
      font-size: 0.875rem;
      font-family: inherit;
      margin-bottom: 0.5rem;
    }
    .flex { display: flex; gap: 0.5rem; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .hidden { display: none !important; }
    .modal { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.5); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 50; 
      padding: 1rem;
      overflow: auto;
    }
    .modal-content { 
      background: white; 
      border-radius: 0.5rem; 
      max-width: 40rem; 
      width: 100%;
      box-shadow: 0 20px 25px rgba(0,0,0,0.15);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header { 
      padding: 1rem; 
      border-bottom: 1px solid #e5e7eb; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }
    .modal-body { padding: 1rem; }
    .modal-footer { 
      padding: 1rem; 
      border-top: 1px solid #e5e7eb; 
      display: flex; 
      gap: 0.5rem; 
      flex-direction: column;
    }
    .wine-card { 
      background: white; 
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem; 
      padding: 1rem; 
      cursor: pointer; 
      transition: all 0.2s;
      margin-bottom: 0.5rem;
    }
    .wine-card:hover { box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
    .wine-name { font-weight: bold; margin-bottom: 0.25rem; }
    .wine-meta { font-size: 0.75rem; color: #6b7280; }
    .tab-btn { 
      padding: 0.5rem 1rem; 
      border: none; 
      cursor: pointer; 
      border-radius: 0.375rem;
      font-family: inherit;
    }
    .tab-active { background: #374151; color: white; }
  </style>
</head>
<body>
  <div id="debug" class="debug">
    <strong>DEBUG LOG:</strong>
    <div id="debugLog"></div>
  </div>

  <div class="container">
    <div class="card">
      <div class="flex-between">
        <h1>🗂 Vinkartotek</h1>
        <div class="flex">
          <button class="btn-primary" id="addBtn">+</button>
          <button class="btn-secondary" id="refreshBtn">↻</button>
        </div>
      </div>
      
      <div id="wineList"></div>
    </div>
  </div>

  <!-- Details Modal -->
  <div id="detailsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="detailsName">Test</h2>
        <button style="background: none; border: none; font-size: 1.5rem; cursor: pointer;" id="closeDetailsBtn">×</button>
      </div>
      <div class="modal-body" id="detailsBody">
        <p>Test content</p>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1QagDAoCbeuAneC0H37PhIVncqUxIslH8lrchBgyfhnA';
    let wines = [];

    function debug(msg) {
      const log = document.getElementById('debugLog');
      const line = document.createElement('div');
      line.textContent = new Date().toLocaleTimeString() + ': ' + msg;
      log.appendChild(line);
      console.log(msg);
    }

    debug('Page loaded');

    const formatDate = (dateValue) => {
      if (!dateValue) return '';
      if (typeof dateValue === 'string' && dateValue.includes('-')) return dateValue;
      return dateValue;
    };

    const toNorwegianDate = (dateString) => {
      if (!dateString) return '';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}.${month}.${year}`;
    };

    const loadData = async () => {
      debug('loadData() called');
      try {
        const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
        debug('Fetch completed, status: ' + r.status);
        
        if (!r.ok) {
          throw new Error('HTTP ' + r.status);
        }
        
        const t = await r.text();
        debug('Got text: ' + t.length + ' chars');
        
        const j = JSON.parse(t.substring(47).slice(0, -2));
        debug('Parsed JSON');
        
        wines = j.table.rows.map((row, i) => ({
          id: i + 1,
          name: row.c[0]?.v || '',
          wineType: row.c[2]?.v || '',
          dateTasted: formatDate(row.c[3]?.v) || '',
          country: row.c[4]?.v || '',
          quality: row.c[20]?.v || ''
        }));
        
        debug('Loaded ' + wines.length + ' wines');
        render();
      } catch (e) {
        debug('ERROR: ' + e.message);
        alert('Feil: ' + e.message);
      }
    };

    const render = () => {
      debug('render() called');
      const list = document.getElementById('wineList');
      list.innerHTML = '';
      
      wines.forEach(w => {
        const card = document.createElement('div');
        card.className = 'wine-card';
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'wine-name';
        nameDiv.textContent = w.name;
        
        const metaDiv = document.createElement('div');
        metaDiv.className = 'wine-meta';
        metaDiv.textContent = `${w.wineType} · ${w.country} · ${toNorwegianDate(w.dateTasted)}`;
        
        card.appendChild(nameDiv);
        card.appendChild(metaDiv);
        
        card.onclick = () => {
          debug('Card clicked: ' + w.id);
          const modal = document.getElementById('detailsModal');
          document.getElementById('detailsName').textContent = w.name;
          document.getElementById('detailsBody').textContent = `${w.wineType} · ${w.country}`;
          modal.classList.remove('hidden');
          debug('Modal should be visible now');
        };
        
        list.appendChild(card);
      });
      debug('render() complete, ' + wines.length + ' cards created');
    };

    debug('Attaching event listeners');
    document.getElementById('closeDetailsBtn').addEventListener('click', () => {
      debug('Close button clicked');
      document.getElementById('detailsModal').classList.add('hidden');
    });

    document.getElementById('addBtn').addEventListener('click', () => {
      debug('Add button clicked');
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      debug('Refresh button clicked');
      loadData();
    });

    debug('Event listeners attached, calling loadData()');
    loadData();
  </script>
</body>
</html>
