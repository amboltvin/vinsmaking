<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinkartotek</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: linear-gradient(135deg, #faf5f0 0%, #f3f4f6 100%);
      min-height: 100vh; 
      padding: 1rem;
    }
    .container { max-width: 80rem; margin: 0 auto; }
    .card { 
      background: white; 
      border-radius: 0.5rem; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
      padding: 1rem; 
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; }
    h2 { font-size: 1.1rem; font-weight: bold; margin: 1rem 0 0.5rem; }
    button { 
      padding: 0.5rem 1rem; 
      border: none; 
      border-radius: 0.375rem; 
      cursor: pointer; 
      font-size: 0.875rem; 
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary { background: #374151; color: white; }
    .btn-primary:hover { background: #1f2937; }
    .btn-secondary { background: #6b7280; color: white; }
    .btn-gray { background: #d1d5db; color: #374151; }
    .btn-red { background: #dc2626; color: white; }
    .btn-blue { background: #2563eb; color: white; }
    input, select, textarea { 
      width: 100%; 
      padding: 0.5rem; 
      border: 1px solid #d1d5db; 
      border-radius: 0.375rem; 
      font-size: 0.875rem;
      font-family: inherit;
      margin-bottom: 0.5rem;
    }
    .flex { display: flex; gap: 0.5rem; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .hidden { display: none; }
    .modal { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.5); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 50; 
      padding: 1rem;
      overflow: auto;
    }
    .modal-content { 
      background: white; 
      border-radius: 0.5rem; 
      max-width: 40rem; 
      width: 100%;
      box-shadow: 0 20px 25px rgba(0,0,0,0.15);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header { 
      padding: 1rem; 
      border-bottom: 1px solid #e5e7eb; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }
    .modal-body { padding: 1rem; }
    .modal-footer { 
      padding: 1rem; 
      border-top: 1px solid #e5e7eb; 
      display: flex; 
      gap: 0.5rem; 
      flex-direction: column;
    }
    .wine-card { 
      background: white; 
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem; 
      padding: 1rem; 
      cursor: pointer; 
      transition: all 0.2s;
      margin-bottom: 0.5rem;
    }
    .wine-card:hover { box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
    .wine-name { font-weight: bold; margin-bottom: 0.25rem; }
    .wine-meta { font-size: 0.75rem; color: #6b7280; }
    .tab-btn { 
      padding: 0.5rem 1rem; 
      border: none; 
      cursor: pointer; 
      border-radius: 0.375rem;
      font-family: inherit;
    }
    .tab-active { background: #374151; color: white; }
    .tab-inactive { background: #d1d5db; color: #374151; }
    .stars { font-weight: bold; }
    .space-y { display: flex; flex-direction: column; gap: 0.5rem; }
    @media (max-width: 640px) {
      body { padding: 0.5rem; }
      .grid-3 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="flex-between">
        <h1>🗂 Vinkartotek</h1>
        <div class="flex">
          <button class="btn-primary" id="addBtn">+</button>
          <button class="btn-secondary" id="refreshBtn">↻</button>
        </div>
      </div>
      
      <div class="flex" style="margin-bottom: 1rem;">
        <button class="tab-btn tab-active" id="tabList">Utforsk</button>
        <button class="tab-btn tab-inactive" id="tabStats">Statistikk</button>
      </div>

      <div id="listView">
        <div class="space-y">
          <input type="text" id="searchInput" placeholder="Søk..." />
          <div class="grid-3">
            <select id="filterType">
              <option value="">Alle typer</option>
              <option value="Rødvin">Rødvin</option>
              <option value="Hvitvin">Hvitvin</option>
              <option value="Rosévin">Rosévin</option>
            </select>
            <select id="filterQuality">
              <option value="">Alle stjerner</option>
            </select>
            <select id="sortBy">
              <option value="newest">Nyeste først</option>
              <option value="quality">Kvalitet</option>
            </select>
          </div>
          <select id="filterCountry">
            <option value="">Alle land</option>
          </select>
          <button class="btn-gray" id="resetBtn">Nullstill</button>
        </div>
      </div>

      <div id="statsView" class="hidden">
        <p style="font-size: 2rem; font-weight: bold; margin: 1rem 0;">-</p>
        <p>Totalt viner</p>
      </div>
    </div>

    <div id="wineList"></div>
  </div>

  <!-- Add Wine Modal -->
  <div id="addModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ny vin</h2>
        <button style="background: none; border: none; font-size: 1.5rem; cursor: pointer;" class="closeBtn">×</button>
      </div>
      <div class="modal-body space-y">
        <input type="text" id="formName" placeholder="Vinnavn *" />
        <input type="url" id="formUrl" placeholder="URL" />
        <select id="formType">
          <option value="">Type vin</option>
          <option value="Rødvin">Rødvin</option>
          <option value="Hvitvin">Hvitvin</option>
        </select>
        <input type="date" id="formDate" />
        <input type="text" id="formCountry" placeholder="Land" />
        <input type="text" id="formGrapes" placeholder="Druer" />
        <div>
          <label style="font-size: 0.875rem; font-weight: 500;">Kvalitet</label>
          <div class="flex" id="starRating"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="saveBtn">Legg til</button>
        <button class="btn-gray" id="cancelBtn">Avbryt</button>
      </div>
    </div>
  </div>

  <!-- Details Modal -->
  <div id="detailsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="detailsName"></h2>
        <button style="background: none; border: none; font-size: 1.5rem; cursor: pointer;" class="closeBtn">×</button>
      </div>
      <div class="modal-body" id="detailsBody"></div>
      <div class="modal-footer">
        <button class="btn-blue" id="editBtn">✎ Rediger</button>
        <button class="btn-gray" id="closeDetailsBtn">Lukk</button>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1QagDAoCbeuAneC0H37PhIVncqUxIslH8lrchBgyfhnA';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyX1qUO2jWSAynR65Ik5c35mp7dyWJMkSSQelRtbmFOyLGsYlS2_8jCoaLNUW9WZVA/exec';
    
    let wines = [];
    let currentView = 'list';
    let selectedWine = null;
    let editingId = null;
    let currentQuality = '';

    const toNorwegianDate = (dateString) => {
      if (!dateString) return '';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}.${month}.${year}`;
    };

    const checkPassword = () => {
      const authorized = localStorage.getItem('vinkartotek_auth');
      if (authorized === 'true') return true;
      const password = prompt('Passord påkrevd for å gjøre endringer:');
      if (password === 'Arteta') {
        localStorage.setItem('vinkartotek_auth', 'true');
        return true;
      }
      alert('Feil passord');
      return false;
    };

    const loadData = async () => {
      try {
        const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
        const t = await r.text();
        const j = JSON.parse(t.substring(47).slice(0, -2));
        
        wines = j.table.rows.map((row, i) => {
          let qualityValue = '';
          if (row.c[20]?.v !== null && row.c[20]?.v !== undefined) {
            qualityValue = String(row.c[20].v);
            if (qualityValue.startsWith("'")) qualityValue = qualityValue.substring(1);
          }
          return {
            id: i + 1,
            name: row.c[0]?.v || '',
            url: row.c[1]?.v || '',
            wineType: row.c[2]?.v || '',
            dateTasted: row.c[3]?.v || '',
            country: row.c[4]?.v || '',
            region: row.c[5]?.v || '',
            subRegion: row.c[6]?.v || '',
            grapes: row.c[7]?.v || '',
            quality: qualityValue
          };
        });
        
        updateFilters();
        render();
      } catch (e) {
        alert('Feil ved lasting: ' + e.message);
      }
    };

    const updateFilters = () => {
      const qualities = [...new Set(wines.map(w => w.quality).filter(Boolean))].sort((a, b) => parseFloat(b) - parseFloat(a));
      const countries = [...new Set(wines.map(w => w.country).filter(Boolean))].sort();
      
      const qualitySelect = document.getElementById('filterQuality');
      qualitySelect.innerHTML = '<option value="">Alle stjerner</option>' + qualities.map(q => `<option value="${q}">${q}★</option>`).join('');
      
      const countrySelect = document.getElementById('filterCountry');
      countrySelect.innerHTML = '<option value="">Alle land</option>' + countries.map(c => `<option value="${c}">${c}</option>`).join('');
    };

    const render = () => {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const type = document.getElementById('filterType').value;
      const quality = document.getElementById('filterQuality').value;
      const country = document.getElementById('filterCountry').value;
      const sort = document.getElementById('sortBy').value;
      
      let filtered = wines.filter(w => {
        const matchSearch = Object.values(w).some(v => String(v).toLowerCase().includes(search));
        const matchType = !type || w.wineType === type;
        const matchQuality = !quality || w.quality === quality;
        const matchCountry = !country || w.country === country;
        return matchSearch && matchType && matchQuality && matchCountry;
      });

      if (sort === 'newest') {
        filtered.sort((a, b) => {
          const dateA = new Date(a.dateTasted || 0);
          const dateB = new Date(b.dateTasted || 0);
          if (dateB.getTime() !== dateA.getTime()) return dateB - dateA;
          return b.id - a.id;
        });
      } else if (sort === 'quality') {
        filtered.sort((a, b) => parseFloat(b.quality || 0) - parseFloat(a.quality || 0));
      }

      const list = document.getElementById('wineList');
      list.innerHTML = '';
      
      filtered.forEach(w => {
        const card = document.createElement('div');
        card.className = 'wine-card';
        card.style.cursor = 'pointer';
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'wine-name';
        nameDiv.textContent = w.name;
        
        const metaDiv = document.createElement('div');
        metaDiv.className = 'wine-meta';
        metaDiv.textContent = `${w.wineType} · ${w.country} · ${toNorwegianDate(w.dateTasted)}`;
        
        const actionDiv = document.createElement('div');
        actionDiv.className = 'flex-between';
        actionDiv.style.marginTop = '0.5rem';
        
        const starsSpan = document.createElement('span');
        starsSpan.className = 'stars';
        starsSpan.textContent = w.quality + '★';
        
        const buttonsDiv = document.createElement('div');
        buttonsDiv.className = 'flex';
        
        if (w.url) {
          const link = document.createElement('a');
          link.href = w.url;
          link.target = '_blank';
          link.style.textDecoration = 'none';
          link.textContent = '🔗';
          buttonsDiv.appendChild(link);
        }
        
        const editBtn = document.createElement('button');
        editBtn.className = 'btn-primary';
        editBtn.style.padding = '0.25rem 0.5rem';
        editBtn.textContent = '✎';
        editBtn.onclick = (e) => editWine(e, w.id);
        buttonsDiv.appendChild(editBtn);
        
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-secondary';
        delBtn.style.padding = '0.25rem 0.5rem';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteWine(e, w.id);
        buttonsDiv.appendChild(delBtn);
        
        actionDiv.appendChild(starsSpan);
        actionDiv.appendChild(buttonsDiv);
        
        card.appendChild(nameDiv);
        card.appendChild(metaDiv);
        card.appendChild(actionDiv);
        card.onclick = () => selectWine(w.id);
        
        list.appendChild(card);
      });

      document.getElementById('statsView').querySelector('p').textContent = wines.length;
    };

    const selectWine = (id) => {
      selectedWine = wines.find(w => w.id === id);
      document.getElementById('detailsName').textContent = selectedWine.name;
      
      const detailsBody = document.getElementById('detailsBody');
      detailsBody.innerHTML = '';
      
      const createDetail = (label, value) => {
        if (!value) return;
        const p = document.createElement('p');
        const strong = document.createElement('strong');
        strong.textContent = label + ': ';
        p.appendChild(strong);
        p.appendChild(document.createTextNode(value));
        detailsBody.appendChild(p);
      };
      
      createDetail('Type', selectedWine.wineType);
      createDetail('Land', selectedWine.country);
      createDetail('Druer', selectedWine.grapes);
      createDetail('Kvalitet', selectedWine.quality + '★');
      
      document.getElementById('detailsModal').classList.remove('hidden');
    };

    const editWine = (e, id) => {
      e.stopPropagation();
      if (!checkPassword()) return;
      const wine = wines.find(w => w.id === id);
      editingId = id;
      document.getElementById('formName').value = wine.name;
      document.getElementById('formUrl').value = wine.url;
      document.getElementById('formType').value = wine.wineType;
      document.getElementById('formDate').value = wine.dateTasted;
      document.getElementById('formCountry').value = wine.country;
      document.getElementById('formGrapes').value = wine.grapes;
      currentQuality = wine.quality;
      updateStarRating();
      document.getElementById('saveBtn').textContent = 'Oppdater';
      document.getElementById('addModal').classList.remove('hidden');
    };

    const deleteWine = async (e, id) => {
      e.stopPropagation();
      if (!checkPassword()) return;
      if (!confirm('Slette?')) return;
      const wine = wines.find(w => w.id === id);
      try {
        const r = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete', name: wine.name, dateTasted: wine.dateTasted })
        });
        const res = await r.json();
        if (res.success) {
          loadData();
          alert('Slettet!');
        } else alert('Feil: ' + res.message);
      } catch (e) {
        alert('Feil: ' + e.message);
      }
    };

    const updateStarRating = () => {
      const container = document.getElementById('starRating');
      const cr = parseFloat(currentQuality) || 0;
      container.innerHTML = [1,2,3,4,5].map(s => `
        <span onclick="setQuality(${s})" style="font-size: 1.5rem; cursor: pointer;">
          ${cr >= s ? '★' : cr === s - 0.5 ? '½' : '☆'}
        </span>
      `).join('');
    };

    const setQuality = (s) => {
      const cr = parseFloat(currentQuality) || 0;
      currentQuality = (cr === s ? s - 0.5 : s).toString();
      updateStarRating();
    };

    const saveWine = async () => {
      const name = document.getElementById('formName').value;
      if (!name) { alert('Navn påkrevd'); return; }

      const formData = {
        name,
        url: document.getElementById('formUrl').value,
        wineType: document.getElementById('formType').value,
        dateTasted: document.getElementById('formDate').value,
        country: document.getElementById('formCountry').value,
        grapes: document.getElementById('formGrapes').value,
        quality: currentQuality
      };

      try {
        const body = editingId ? {
          action: 'update',
          originalName: wines.find(w => w.id === editingId).name,
          originalDate: wines.find(w => w.id === editingId).dateTasted,
          ...formData
        } : { action: 'add', ...formData };

        const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
        const res = await r.json();
        if (res.success) {
          loadData();
          closeAddModal();
        } else alert('Feil: ' + res.message);
      } catch (e) {
        alert('Feil: ' + e.message);
      }
    };

    const closeAddModal = () => {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('formName').value = '';
      document.getElementById('formUrl').value = '';
      document.getElementById('formType').value = '';
      document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('formCountry').value = '';
      document.getElementById('formGrapes').value = '';
      currentQuality = '';
      editingId = null;
      document.getElementById('saveBtn').textContent = 'Legg til';
    };

    // Event listeners
    document.getElementById('addBtn').addEventListener('click', () => {
      if (checkPassword()) {
        document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('addModal').classList.remove('hidden');
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('saveBtn').addEventListener('click', saveWine);
    document.getElementById('cancelBtn').addEventListener('click', closeAddModal);
    document.getElementById('closeDetailsBtn').addEventListener('click', () => document.getElementById('detailsModal').classList.add('hidden'));
    
    document.querySelectorAll('.closeBtn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (e.target.closest('#addModal')) closeAddModal();
        else document.getElementById('detailsModal').classList.add('hidden');
      });
    });

    document.getElementById('editBtn').addEventListener('click', () => {
      editWine({stopPropagation: () => {}}, selectedWine.id);
      document.getElementById('detailsModal').classList.add('hidden');
    });

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('filterType').addEventListener('change', render);
    document.getElementById('filterQuality').addEventListener('change', render);
    document.getElementById('sortBy').addEventListener('change', render);
    document.getElementById('filterCountry').addEventListener('change', render);
    
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterType').value = '';
      document.getElementById('filterQuality').value = '';
      document.getElementById('filterCountry').value = '';
      document.getElementById('sortBy').value = 'newest';
      render();
    });

    document.getElementById('tabList').addEventListener('click', () => {
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('statsView').classList.add('hidden');
      document.getElementById('tabList').classList.add('tab-active');
      document.getElementById('tabList').classList.remove('tab-inactive');
      document.getElementById('tabStats').classList.remove('tab-active');
      document.getElementById('tabStats').classList.add('tab-inactive');
    });

    document.getElementById('tabStats').addEventListener('click', () => {
      document.getElementById('listView').classList.add('hidden');
      document.getElementById('statsView').classList.remove('hidden');
      document.getElementById('tabStats').classList.add('tab-active');
      document.getElementById('tabStats').classList.remove('tab-inactive');
      document.getElementById('tabList').classList.remove('tab-active');
      document.getElementById('tabList').classList.add('tab-inactive');
    });

    // Load data on start
    loadData();
  </script>
</body>
</html>
