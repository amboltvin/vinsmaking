<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinkartotek</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  background: linear-gradient(135deg, #faf5f0 0%, #f3f4f6 100%);
  min-height: 100vh;
  padding: 1.5rem;
}
#root { max-width: 80rem; margin: 0 auto; }
.header { background: white; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 1.5rem; margin-bottom: 1.5rem; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.header-top h1 { font-size: 1.875rem; margin: 0; }
.button-group { display: flex; gap: 0.5rem; }
button { 
  padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; 
  font-size: 0.875rem; font-family: inherit; transition: all 0.2s;
}
.btn-primary { background: #374151; color: white; }
.btn-primary:hover { background: #1f2937; }
.btn-secondary { background: #d1d5db; color: #374151; }
.btn-secondary:hover { background: #9ca3af; }
.btn-light { background: #f3f4f6; color: #374151; }
.btn-light:hover { background: #e5e7eb; }
.btn-danger { background: #dc2626; color: white; }
.btn-danger:hover { background: #b91c1c; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
.tab-btn { padding: 0.5rem 1rem; border: none; background: #d1d5db; color: #374151; cursor: pointer; border-radius: 0.375rem; }
.tab-btn.active { background: #374151; color: white; }
.filters { display: flex; flex-direction: column; gap: 0.75rem; }
select, input[type="text"], input[type="url"], input[type="date"] {
  padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; 
  font-size: 0.875rem; font-family: inherit; width: 100%;
}
select:focus, input:focus { outline: none; border-color: #2563eb; }
.filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; }
.wine-list { display: flex; flex-direction: column; gap: 0.75rem; }
.wine-card { 
  background: white; border: 1px solid #e5e7eb; border-radius: 0.5rem; 
  padding: 1rem; cursor: pointer; transition: box-shadow 0.2s;
}
.wine-card:hover { box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
.wine-name { font-weight: bold; font-size: 1rem; margin-bottom: 0.25rem; }
.wine-meta { font-size: 0.75rem; color: #6b7280; margin-bottom: 0.75rem; }
.wine-footer { display: flex; justify-content: space-between; align-items: center; }
.wine-quality { font-weight: bold; }
.wine-actions { display: flex; gap: 0.5rem; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 50; padding: 1rem; overflow-y: auto; }
.modal.open { display: flex; }
.modal-content { background: white; border-radius: 0.5rem; max-width: 40rem; width: 100%; box-shadow: 0 20px 25px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; }
.modal-header { padding: 1rem; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 1.25rem; margin: 0; }
.close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6b7280; }
.modal-body { padding: 1rem; }
.modal-footer { padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; flex-wrap: wrap; }
.form-group { margin-bottom: 0.75rem; }
.form-label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem; color: #374151; }
.stars { font-size: 1.5rem; cursor: pointer; }
.stats-box { background: white; border-radius: 0.5rem; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.stats-number { font-size: 2rem; font-weight: bold; color: #374151; }
.stats-label { color: #6b7280; font-size: 0.875rem; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const SHEET_ID = '1QagDAoCbeuAneC0H37PhIVncqUxIslH8lrchBgyfhnA';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyX1qUO2jWSAynR65Ik5c35mp7dyWJMkSSQelRtbmFOyLGsYlS2_8jCoaLNUW9WZVA/exec';

const formatDate = (dateValue) => {
  if (!dateValue) return '';
  if (typeof dateValue === 'string' && dateValue.includes('-')) return dateValue;
  if (typeof dateValue === 'string' && dateValue.startsWith('Date(')) {
    const match = dateValue.match(/Date\((\d+),(\d+),(\d+)\)/);
    if (match) {
      const year = parseInt(match[1]);
      const month = String(parseInt(match[2]) + 1).padStart(2, '0');
      const day = String(parseInt(match[3])).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }
  }
  return dateValue;
};

const toNorwegianDate = (dateString) => {
  if (!dateString) return '';
  const date = new Date(dateString);
  if (isNaN(date.getTime())) return dateString;
  const day = String(date.getDate()).padStart(2, '0');
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const year = date.getFullYear();
  return `${day}.${month}.${year}`;
};

const renderStars = (quality) => {
  const cr = parseFloat(quality) || 0;
  let stars = '';
  for (let i = 1; i <= 5; i++) {
    if (cr >= i) stars += '★';
    else if (cr >= i - 0.5) stars += '½';
    else stars += '☆';
  }
  return stars;
};

function App() {
  const [wines, setWines] = useState([]);
  const [view, setView] = useState('list');
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('newest');
  const [filterWineType, setFilterWineType] = useState('');
  const [filterQuality, setFilterQuality] = useState('');
  const [filterCountry, setFilterCountry] = useState('');
  const [showForm, setShowForm] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  const [selectedWine, setSelectedWine] = useState(null);
  const [editId, setEditId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [loading, setLoading] = useState(false);
  const [statsCountryFilter, setStatsCountryFilter] = useState('');
  const [statsRegionFilter, setStatsRegionFilter] = useState('');
  const [showAllGrapes, setShowAllGrapes] = useState(false);
  const [form, setForm] = useState({
    name: '', url: '', wineType: '', dateTasted: new Date().toISOString().split('T')[0],
    country: '', region: '', subRegion: '', grapes: '',
    sightClarity: '', sightIntensity: '', sightColor: '',
    noseCondition: '', noseIntensity: '', noseAroma: '',
    sweetness: '', acid: '', tannin: '', body: '', taste: '', length: '', quality: ''
  });

  const checkPassword = () => {
    const authorized = localStorage.getItem('vinkartotek_auth');
    if (authorized === 'true') return true;
    const password = prompt('Passord påkrevd for å gjøre endringer:');
    if (password === 'Arteta') {
      localStorage.setItem('vinkartotek_auth', 'true');
      return true;
    }
    alert('Feil passord');
    return false;
  };

  const resetForm = () => {
    setForm({
      name: '', url: '', wineType: '', dateTasted: new Date().toISOString().split('T')[0],
      country: '', region: '', subRegion: '', grapes: '',
      sightClarity: '', sightIntensity: '', sightColor: '',
      noseCondition: '', noseIntensity: '', noseAroma: '',
      sweetness: '', acid: '', tannin: '', body: '', taste: '', length: '', quality: ''
    });
  };

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    setLoading(true);
    try {
      const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
      const t = await r.text();
      const j = JSON.parse(t.substring(47).slice(0, -2));
      const ws = j.table.rows.map((row, i) => {
        let qualityValue = '';
        if (row.c[20]?.v !== null && row.c[20]?.v !== undefined) {
          qualityValue = String(row.c[20].v);
          if (qualityValue.startsWith("'")) qualityValue = qualityValue.substring(1);
        }
        return {
          id: i + 1,
          name: row.c[0]?.v || '', url: row.c[1]?.v || '', wineType: row.c[2]?.v || '',
          dateTasted: formatDate(row.c[3]?.v) || '', country: row.c[4]?.v || '', region: row.c[5]?.v || '',
          subRegion: row.c[6]?.v || '', grapes: row.c[7]?.v || '',
          sightClarity: row.c[8]?.v || '', sightIntensity: row.c[9]?.v || '', sightColor: row.c[10]?.v || '',
          noseCondition: row.c[11]?.v || '', noseIntensity: row.c[12]?.v || '', noseAroma: row.c[13]?.v || '',
          sweetness: row.c[14]?.v || '', acid: row.c[15]?.v || '', tannin: row.c[16]?.v || '',
          body: row.c[17]?.v || '', taste: row.c[18]?.v || '', length: row.c[19]?.v || '', quality: qualityValue
        };
      });
      setWines(ws);
    } catch (e) {
      alert('Feil ved lasting: ' + e.message);
    }
    finally { setLoading(false); }
  };

  const save = async () => {
    if (!form.name) { alert('Navn påkrevd'); return; }
    setSaving(true);
    try {
      const body = editId ? {
        action: 'update',
        originalName: wines.find(w => w.id === editId).name,
        originalDate: wines.find(w => w.id === editId).dateTasted,
        ...form
      } : { action: 'add', ...form };
      const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
      const res = await r.json();
      if (res.success) {
        loadData();
        setShowForm(false);
        setEditId(null);
        resetForm();
      } else {
        alert('Feil: ' + res.message);
      }
    } catch (e) {
      alert('Feil: ' + e.message);
    }
    finally { setSaving(false); }
  };

  const del = async (id) => {
    if (!checkPassword()) return;
    if (!confirm('Slette?')) return;
    try {
      const w = wines.find(w => w.id === id);
      const r = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', name: w.name, dateTasted: w.dateTasted })
      });
      const res = await r.json();
      if (res.success) { 
        loadData(); 
        alert('Slettet!');
      } else {
        alert('Feil: ' + res.message);
      }
    } catch (e) {
      alert('Feil: ' + e.message);
    }
  };

  const filtered = wines.filter(w => {
    const matchesSearch = Object.values(w).some(v => String(v).toLowerCase().includes(search.toLowerCase()));
    const matchesWineType = !filterWineType || w.wineType === filterWineType;
    const matchesQuality = !filterQuality || w.quality === filterQuality;
    const matchesCountry = !filterCountry || w.country === filterCountry;
    return matchesSearch && matchesWineType && matchesQuality && matchesCountry;
  });

  const uniqueCountries = [...new Set(wines.map(w => w.country).filter(Boolean))].sort();
  const uniqueQualities = [...new Set(wines.map(w => w.quality).filter(Boolean))].sort((a, b) => parseFloat(b) - parseFloat(a));

  const sorted = [...filtered].sort((a, b) => {
    if (sortBy === 'newest') {
      const dateA = new Date(a.dateTasted || 0);
      const dateB = new Date(b.dateTasted || 0);
      return dateB - dateA;
    }
    if (sortBy === 'quality') {
      return (parseFloat(b.quality) || 0) - (parseFloat(a.quality) || 0);
    }
    if (sortBy === 'country') return (a.country || '').localeCompare(b.country || '');
    return 0;
  });

  const PieChart = ({ data, colors, size = 280 }) => {
    const total = Object.values(data).reduce((a, b) => a + b, 0);
    if (total === 0) return <div style={{color: '#6b7280'}}>Ingen data</div>;
    
    let currentAngle = 0;
    const slices = Object.entries(data).map(([label, value], idx) => {
      const sliceAngle = (value / total) * 360;
      const startAngle = currentAngle;
      const endAngle = currentAngle + sliceAngle;
      currentAngle = endAngle;
      
      const radius = size / 2.2;
      const centerX = size / 2;
      const centerY = size / 2;
      
      const start = {
        x: centerX + radius * Math.cos((startAngle - 90) * Math.PI / 180),
        y: centerY + radius * Math.sin((startAngle - 90) * Math.PI / 180)
      };
      const end = {
        x: centerX + radius * Math.cos((endAngle - 90) * Math.PI / 180),
        y: centerY + radius * Math.sin((endAngle - 90) * Math.PI / 180)
      };
      const largeArc = sliceAngle > 180 ? 1 : 0;
      const path = `M ${centerX} ${centerY} L ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
      
      return { label, value, path, color: colors[idx % colors.length] };
    });
    
    return (
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display: 'block'}}>
        {slices.map((slice, i) => (
          <path key={i} d={slice.path} fill={slice.color} stroke="white" strokeWidth="2" />
        ))}
      </svg>
    );
  };

  return (
    <div>
      <div className="header">
        <div className="header-top">
          <h1>🗂 Vinkartotek</h1>
          <div className="button-group">
            <button onClick={() => { if (checkPassword()) { resetForm(); setEditId(null); setShowForm(true); } }} className="btn-primary">+</button>
            <button onClick={() => { loadData(); }} disabled={loading} className="btn-secondary">{loading ? '⟳' : '↻'}</button>
          </div>
        </div>

        <div className="tabs">
          <button className={`tab-btn ${view === 'list' ? 'active' : ''}`} onClick={() => setView('list')}>Utforsk</button>
          <button className={`tab-btn ${view === 'stats' ? 'active' : ''}`} onClick={() => setView('stats')}>Statistikk</button>
        </div>

        {view === 'list' && (
          <div className="filters">
            <input type="text" placeholder="Søk..." value={search} onChange={(e) => setSearch(e.target.value)} />
            <div className="filter-row">
              <select value={filterWineType} onChange={(e) => setFilterWineType(e.target.value)}>
                <option value="">Alle typer</option>
                {[...new Set(wines.map(w => w.wineType).filter(Boolean))].sort().map(t => <option key={t} value={t}>{t}</option>)}
              </select>
              <select value={filterQuality} onChange={(e) => setFilterQuality(e.target.value)}>
                <option value="">Alle stjerner</option>
                {uniqueQualities.map(q => <option key={q} value={q}>{q}★</option>)}
              </select>
              <select value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                <option value="newest">Nyeste først</option>
                <option value="quality">Kvalitet</option>
                <option value="country">Land</option>
              </select>
            </div>
            <select value={filterCountry} onChange={(e) => { setFilterCountry(e.target.value); }} className="form-control form-control-sm mb-3">
              <option value="">Alle land</option>
              {uniqueCountries.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <button onClick={() => { setSearch(''); setFilterWineType(''); setFilterQuality(''); setFilterCountry(''); setSortBy('newest'); }} className="btn-light">Nullstill</button>
          </div>
        )}
      </div>

      {view === 'list' && (
        <div>
          <div style={{textAlign: 'center', color: '#6b7280', marginBottom: '1rem'}}>{sorted.length} viner</div>
          {sorted.length === 0 ? (
            <div style={{background: 'white', padding: '2rem', borderRadius: '0.5rem', textAlign: 'center', color: '#6b7280'}}>Ingen viner matcher søket</div>
          ) : (
            <div className="wine-list">
              {sorted.map(w => (
                <div key={w.id} className="wine-card" onClick={() => { setSelectedWine(w); setShowDetails(true); }}>
                  <div className="wine-name">{w.name}</div>
                  <div className="wine-meta">
                    {w.wineType && <span>{w.wineType}</span>}
                    {w.country && <span style={{marginLeft: '0.5rem'}}>{w.country}</span>}
                    {w.region && <span style={{color: '#9ca3af', marginLeft: '0.5rem'}}>{w.region}</span>}
                    {w.subRegion && <span style={{color: '#d1d5db', marginLeft: '0.5rem'}}>{w.subRegion}</span>}
                    {w.dateTasted && <span style={{marginLeft: '0.75rem'}}>{toNorwegianDate(w.dateTasted)}</span>}
                  </div>
                  <div className="wine-footer">
                    {w.quality && <div className="wine-quality">{renderStars(w.quality)}</div>}
                    <div className="wine-actions">
                      {w.url && <a href={w.url} target="_blank" rel="noreferrer" style={{textDecoration: 'none'}} onClick={(e) => e.stopPropagation()}>🔗</a>}
                      <button onClick={(e) => { e.stopPropagation(); if (checkPassword()) { setForm(w); setEditId(w.id); setShowForm(true); } }} className="btn-primary">✎</button>
                      <button onClick={(e) => { e.stopPropagation(); del(w.id); }} className="btn-danger">✕</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {view === 'stats' && (
        <div>
          <div className="stats-box" style={{marginBottom: '1.5rem'}}>
            <div className="stats-number">{wines.filter(w => {
              if (statsCountryFilter && w.country !== statsCountryFilter) return false;
              if (statsRegionFilter && w.region !== statsRegionFilter) return false;
              return true;
            }).length}</div>
            <div className="stats-label">Viner {statsCountryFilter ? `fra ${statsCountryFilter}` : 'i samlingen'}</div>
          </div>

          <div className="stats-box" style={{marginBottom: '1.5rem'}}>
            <h3 style={{fontSize: '1rem', fontWeight: '600', marginBottom: '1rem'}}>Filtrer statistikk</h3>
            <select value={statsCountryFilter} onChange={(e) => { setStatsCountryFilter(e.target.value); setStatsRegionFilter(''); }} style={{marginBottom: '0.75rem', padding: '0.5rem', border: '1px solid #d1d5db', borderRadius: '0.375rem', width: '100%', fontFamily: 'inherit'}}>
              <option value="">Alle land</option>
              {[...new Set(wines.map(w => w.country).filter(Boolean))].sort().map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            {statsCountryFilter && (
              <select value={statsRegionFilter} onChange={(e) => setStatsRegionFilter(e.target.value)} style={{padding: '0.5rem', border: '1px solid #d1d5db', borderRadius: '0.375rem', width: '100%', fontFamily: 'inherit'}}>
                <option value="">Alle regioner</option>
                {[...new Set(wines.filter(w => w.country === statsCountryFilter).map(w => w.region).filter(Boolean))].sort().map(r => <option key={r} value={r}>{r}</option>)}
              </select>
            )}
          </div>

          {(() => {
            const filteredWines = wines.filter(w => {
              if (statsCountryFilter && w.country !== statsCountryFilter) return false;
              if (statsRegionFilter && w.region !== statsRegionFilter) return false;
              return true;
            });

            const wineTypeStats = {};
            const qualityStats = {};
            const grapeStats = {};
            const regionStats = {};
            const countryStats = {};

            filteredWines.forEach(w => {
              if (w.wineType) wineTypeStats[w.wineType] = (wineTypeStats[w.wineType] || 0) + 1;
              if (w.quality) qualityStats[w.quality] = (qualityStats[w.quality] || 0) + 1;
              if (w.grapes) {
                w.grapes.split(',').forEach(g => {
                  const match = g.match(/^(.+?)[\s]*(\d+(\.\d+)?)%?$/);
                  if (match) {
                    const grapeName = match[1].trim();
                    const percentage = parseFloat(match[2]) || 0;
                    grapeStats[grapeName] = (grapeStats[grapeName] || 0) + percentage;
                  }
                });
              }
              if (w.region) regionStats[w.region] = (regionStats[w.region] || 0) + 1;
              if (w.country) countryStats[w.country] = (countryStats[w.country] || 0) + 1;
            });

            // Average grape percentages
            if (Object.keys(grapeStats).length > 0 && filteredWines.length > 0) {
              Object.keys(grapeStats).forEach(grape => {
                grapeStats[grape] = grapeStats[grape] / filteredWines.length;
              });
            }

            const StatBoxWithChart = ({ title, data, colors, isGrapes = false }) => {
              const entries = Object.entries(data).sort((a, b) => b[1] - a[1]).slice(0, 10);
              if (entries.length === 0) return null;
              
              return (
                <div className="stats-box" style={{marginBottom: '1.5rem'}}>
                  <h3 style={{fontSize: '1rem', fontWeight: '600', marginBottom: '1rem'}}>{title}</h3>
                  <div style={{display: 'flex', gap: '2rem', alignItems: 'flex-start'}}>
                    <div style={{flex: '0 0 40%'}}>
                      {entries.map((entry, i) => (
                        <div key={entry[0]} style={{display: 'flex', alignItems: 'center', marginBottom: '0.75rem', fontSize: '0.875rem'}}>
                          <div style={{width: '14px', height: '14px', background: colors[i % colors.length], marginRight: '0.75rem', borderRadius: '2px', flexShrink: 0}}></div>
                          <span style={{flex: 1}}>{entry[0]}</span>
                          <span style={{fontWeight: '600', marginLeft: '0.5rem'}}>{isGrapes ? entry[1].toFixed(1) : Math.round(entry[1])}{isGrapes ? '%' : ''}</span>
                        </div>
                      ))}
                    </div>
                    <div style={{flex: '0 0 60%', display: 'flex', justifyContent: 'center'}}>
                      <PieChart data={Object.fromEntries(entries)} colors={colors} size={280} />
                    </div>
                  </div>
                </div>
              );
            };

            return (
              <>
                <StatBoxWithChart 
                  title="Fordeling etter type vin" 
                  data={wineTypeStats} 
                  colors={['#374151', '#2563eb', '#9333ea', '#dc2626', '#059669', '#f59e0b']}
                />

                <StatBoxWithChart 
                  title="Fordeling etter kvalitet" 
                  data={Object.fromEntries(Object.entries(qualityStats).sort((a, b) => parseFloat(b[0]) - parseFloat(a[0])).map(([q, c]) => [renderStars(q), c]))}
                  colors={['#fbbf24', '#f59e0b', '#f97316', '#ef4444', '#dc2626']}
                />

                <div className="stats-box" style={{marginBottom: '1.5rem'}}>
                  <h3 style={{fontSize: '1rem', fontWeight: '600', marginBottom: '1rem'}}>Top 20 druer (av {Object.keys(grapeStats).length} totalt)</h3>
                  <div style={{display: 'flex', gap: '2rem', alignItems: 'flex-start'}}>
                    <div style={{flex: '0 0 40%'}}>
                      {Object.entries(grapeStats).sort((a, b) => b[1] - a[1]).slice(0, 20).map((entry, i) => (
                        <div key={entry[0]} style={{display: 'flex', alignItems: 'center', marginBottom: '0.75rem', fontSize: '0.875rem'}}>
                          <div style={{width: '14px', height: '14px', background: ['#374151', '#2563eb', '#9333ea', '#dc2626', '#059669', '#f59e0b', '#0ea5e9', '#8b5cf6', '#ec4899', '#14b8a6', '#f59e0b', '#ef4444', '#06b6d4', '#a855f7', '#f97316'][i % 15], marginRight: '0.75rem', borderRadius: '2px', flexShrink: 0}}></div>
                          <span style={{flex: 1}}>{entry[0]}</span>
                          <span style={{fontWeight: '600', marginLeft: '0.5rem'}}>{entry[1].toFixed(1)}%</span>
                        </div>
                      ))}
                    </div>
                    <div style={{flex: '0 0 60%', display: 'flex', justifyContent: 'center'}}>
                      <PieChart data={Object.fromEntries(Object.entries(grapeStats).sort((a, b) => b[1] - a[1]).slice(0, 20))} colors={['#374151', '#2563eb', '#9333ea', '#dc2626', '#059669', '#f59e0b', '#0ea5e9', '#8b5cf6', '#ec4899', '#14b8a6', '#f59e0b', '#ef4444', '#06b6d4', '#a855f7', '#f97316']} size={280} />
                    </div>
                  </div>
                  {Object.keys(grapeStats).length > 20 && (
                    <button onClick={() => setShowAllGrapes(!showAllGrapes)} style={{marginTop: '1rem', padding: '0.5rem 1rem', background: '#374151', color: 'white', border: 'none', borderRadius: '0.375rem', cursor: 'pointer', fontSize: '0.875rem'}}>
                      {showAllGrapes ? 'Skjul full liste' : 'Vis full liste'}
                    </button>
                  )}
                  {showAllGrapes && (
                    <div style={{marginTop: '1rem', maxHeight: '400px', overflowY: 'auto', padding: '1rem', background: '#f3f4f6', borderRadius: '0.375rem'}}>
                      {Object.entries(grapeStats).sort((a, b) => b[1] - a[1]).map(([grape, percentage]) => (
                        <div key={grape} style={{display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem', fontSize: '0.875rem', borderBottom: '1px solid #e5e7eb', paddingBottom: '0.25rem'}}>
                          <span>{grape}</span>
                          <span style={{fontWeight: '600'}}>{percentage.toFixed(1)}%</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <StatBoxWithChart 
                  title="Top 10 regioner" 
                  data={regionStats}
                  colors={['#374151', '#2563eb', '#9333ea', '#dc2626', '#059669', '#f59e0b', '#0ea5e9', '#8b5cf6', '#ec4899', '#14b8a6']}
                />

                <StatBoxWithChart 
                  title={`Top 10 land ${statsCountryFilter ? '(filtrert)' : ''}`}
                  data={statsCountryFilter ? { [statsCountryFilter]: countryStats[statsCountryFilter] || 0 } : countryStats}
                  colors={['#374151', '#2563eb', '#9333ea', '#dc2626', '#059669', '#f59e0b', '#0ea5e9', '#8b5cf6', '#ec4899', '#14b8a6']}
                />

                <div className="stats-box" style={{marginBottom: '1.5rem'}}>
                  <h3 style={{fontSize: '1rem', fontWeight: '600', marginBottom: '1rem'}}>Top 10 land etter gjennomsnittlig kvalitet (min 5 viner)</h3>
                  <div style={{display: 'flex', flexDirection: 'column', gap: '0.75rem'}}>
                    {(() => {
                      const countryRatings = {};
                      filteredWines.forEach(w => {
                        if (w.country && w.quality) {
                          if (!countryRatings[w.country]) countryRatings[w.country] = { total: 0, count: 0 };
                          countryRatings[w.country].total += parseFloat(w.quality);
                          countryRatings[w.country].count += 1;
                        }
                      });
                      
                      return Object.entries(countryRatings)
                        .filter(([_, data]) => data.count >= 5)
                        .map(([country, data]) => [country, data.total / data.count, data.count])
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 10)
                        .map(([country, avgRating, count]) => (
                          <div key={country} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: '0.5rem', borderBottom: '1px solid #e5e7eb', fontSize: '0.875rem'}}>
                            <span>{country}</span>
                            <div style={{textAlign: 'right'}}>
                              <div style={{fontWeight: '600'}}>{avgRating.toFixed(2)}★</div>
                              <div style={{fontSize: '0.75rem', color: '#6b7280'}}>({count} viner)</div>
                            </div>
                          </div>
                        ));
                    })()}
                  </div>
                </div>

                <div className="stats-box">
                  <h3 style={{fontSize: '1rem', fontWeight: '600', marginBottom: '1rem'}}>Top 10 regioner etter gjennomsnittlig kvalitet (min 5 viner) {statsCountryFilter && `(fra ${statsCountryFilter})`}</h3>
                  <div style={{display: 'flex', flexDirection: 'column', gap: '0.75rem'}}>
                    {(() => {
                      const regionRatings = {};
                      filteredWines.forEach(w => {
                        if (w.region && w.quality && (!statsCountryFilter || w.country === statsCountryFilter)) {
                          if (!regionRatings[w.region]) regionRatings[w.region] = { total: 0, count: 0 };
                          regionRatings[w.region].total += parseFloat(w.quality);
                          regionRatings[w.region].count += 1;
                        }
                      });
                      
                      return Object.entries(regionRatings)
                        .filter(([_, data]) => data.count >= 5)
                        .map(([region, data]) => [region, data.total / data.count, data.count])
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 10)
                        .map(([region, avgRating, count]) => (
                          <div key={region} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: '0.5rem', borderBottom: '1px solid #e5e7eb', fontSize: '0.875rem'}}>
                            <span>{region}</span>
                            <div style={{textAlign: 'right'}}>
                              <div style={{fontWeight: '600'}}>{avgRating.toFixed(2)}★</div>
                              <div style={{fontSize: '0.75rem', color: '#6b7280'}}>({count} viner)</div>
                            </div>
                          </div>
                        ));
                    })()}
                  </div>
                </div>
              </>
            );
          })()}
        </div>
      )}

      {showDetails && selectedWine && (
        <div className="modal open">
          <div className="modal-content">
            <div className="modal-header">
              <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                <h2 style={{margin: 0}}>{selectedWine.name}</h2>
                {selectedWine.url && <a href={selectedWine.url} target="_blank" rel="noreferrer" style={{textDecoration: 'none', fontSize: '1.25rem'}}>🔗</a>}
              </div>
              <button className="close-btn" onClick={() => { setShowDetails(false); setSelectedWine(null); }}>×</button>
            </div>
            <div className="modal-body">
              {selectedWine.wineType && <p><strong>Type:</strong> {selectedWine.wineType}</p>}
              {selectedWine.dateTasted && <p><strong>Dato:</strong> {toNorwegianDate(selectedWine.dateTasted)}</p>}
              {selectedWine.country && <p><strong>Land:</strong> {selectedWine.country}</p>}
              {selectedWine.region && <p><strong>Region:</strong> {selectedWine.region}</p>}
              {selectedWine.subRegion && <p><strong>Underregion:</strong> {selectedWine.subRegion}</p>}
              {selectedWine.grapes && <p><strong>Druer:</strong> {selectedWine.grapes}</p>}
              {selectedWine.quality && <p><strong>Kvalitet:</strong> {renderStars(selectedWine.quality)}</p>}
            </div>
            <div className="modal-footer">
              <button onClick={() => { if (checkPassword()) { setForm(selectedWine); setEditId(selectedWine.id); setShowDetails(false); setShowForm(true); } }} className="btn-primary">Rediger</button>
              <button onClick={() => { setShowDetails(false); setSelectedWine(null); }} className="btn-secondary">Lukk</button>
            </div>
          </div>
        </div>
      )}

      {showForm && (
        <div className="modal open">
          <div className="modal-content">
            <div className="modal-header">
              <h2>{editId ? 'Rediger vin' : 'Ny vin'}</h2>
              <button className="close-btn" onClick={() => { setShowForm(false); setEditId(null); resetForm(); }}>×</button>
            </div>
            <div className="modal-body">
              <div className="form-group"><label className="form-label">Vinnavn *</label><input type="text" value={form.name} onChange={(e) => setForm(p => ({ ...p, name: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">URL</label><input type="url" value={form.url} onChange={(e) => setForm(p => ({ ...p, url: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">Type vin</label><select value={form.wineType} onChange={(e) => setForm(p => ({ ...p, wineType: e.target.value }))}><option value="">Velg type</option><option value="Rødvin">Rødvin</option><option value="Hvitvin">Hvitvin</option><option value="Rosévin">Rosévin</option></select></div>
              <div className="form-group"><label className="form-label">Dato</label><input type="date" value={form.dateTasted} onChange={(e) => setForm(p => ({ ...p, dateTasted: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">Land</label><input type="text" value={form.country} onChange={(e) => setForm(p => ({ ...p, country: e.target.value, region: '', subRegion: '' }))} list="countries-list" /><datalist id="countries-list">{[...new Set(wines.map(w => w.country).filter(Boolean))].sort().map(c => <option key={c} value={c} />)}</datalist></div>
              <div className="form-group"><label className="form-label">Region</label><input type="text" value={form.region} onChange={(e) => setForm(p => ({ ...p, region: e.target.value, subRegion: '' }))} list="regions-list" /><datalist id="regions-list">{form.country && [...new Set(wines.filter(w => w.country === form.country).map(w => w.region).filter(Boolean))].sort().map(r => <option key={r} value={r} />)}</datalist></div>
              <div className="form-group"><label className="form-label">Underregion</label><input type="text" value={form.subRegion} onChange={(e) => setForm(p => ({ ...p, subRegion: e.target.value }))} list="subregions-list" /><datalist id="subregions-list">{form.region && [...new Set(wines.filter(w => w.country === form.country && w.region === form.region).map(w => w.subRegion).filter(Boolean))].sort().map(sr => <option key={sr} value={sr} />)}</datalist></div>
              <div className="form-group"><label className="form-label">Druer</label><input type="text" value={form.grapes} onChange={(e) => setForm(p => ({ ...p, grapes: e.target.value }))} list="grapes-list" /><datalist id="grapes-list">{(() => {const grapeSet = new Set(); wines.filter(w => !form.country || w.country === form.country).forEach(w => {if (w.grapes) {w.grapes.split(',').forEach(g => {const grape = g.trim().replace(/\d+(\.\d+)?%/g, '').trim(); if (grape) grapeSet.add(grape);}); }}); return [...grapeSet].sort().map(g => <option key={g} value={g} />);})()}</datalist></div>
              <h3 style={{fontSize: '0.875rem', fontWeight: '600', marginTop: '1rem', marginBottom: '0.5rem'}}>Utseende</h3>
              <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.5rem'}}><div className="form-group" style={{marginBottom: 0}}><input type="text" placeholder="Klarhet" value={form.sightClarity} onChange={(e) => setForm(p => ({ ...p, sightClarity: e.target.value }))} /></div><div className="form-group" style={{marginBottom: 0}}><input type="text" placeholder="Intensitet" value={form.sightIntensity} onChange={(e) => setForm(p => ({ ...p, sightIntensity: e.target.value }))} /></div><div className="form-group" style={{marginBottom: 0}}><input type="text" placeholder="Farge" value={form.sightColor} onChange={(e) => setForm(p => ({ ...p, sightColor: e.target.value }))} /></div></div>
              <h3 style={{fontSize: '0.875rem', fontWeight: '600', marginTop: '1rem', marginBottom: '0.5rem'}}>Duft</h3>
              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem'}}><div className="form-group" style={{marginBottom: 0}}><input type="text" placeholder="Tilstand" value={form.noseCondition} onChange={(e) => setForm(p => ({ ...p, noseCondition: e.target.value }))} /></div><div className="form-group" style={{marginBottom: 0}}><input type="text" placeholder="Intensitet" value={form.noseIntensity} onChange={(e) => setForm(p => ({ ...p, noseIntensity: e.target.value }))} /></div></div><div className="form-group"><input type="text" placeholder="Aroma" value={form.noseAroma} onChange={(e) => setForm(p => ({ ...p, noseAroma: e.target.value }))} /></div>
              <h3 style={{fontSize: '0.875rem', fontWeight: '600', marginTop: '1rem', marginBottom: '0.5rem'}}>Smak</h3>
              <div style={{display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.5rem'}}><div className="form-group" style={{marginBottom: 0}}><input type="text" placeholder="Sødme" value={form.sweetness} onChange={(e) => setForm(p => ({ ...p, sweetness: e.target.value }))} /></div><div className="form-group" style={{marginBottom: 0}}><input type="text" placeholder="Syrlighet" value={form.acid} onChange={(e) => setForm(p => ({ ...p, acid: e.target.value }))} /></div><div className="form-group" style={{marginBottom: 0}}><input type="text" placeholder="Tannin" value={form.tannin} onChange={(e) => setForm(p => ({ ...p, tannin: e.target.value }))} /></div><div className="form-group" style={{marginBottom: 0}}><input type="text" placeholder="Kropp" value={form.body} onChange={(e) => setForm(p => ({ ...p, body: e.target.value }))} /></div></div>
              <div className="form-group"><input type="text" placeholder="Smak" value={form.taste} onChange={(e) => setForm(p => ({ ...p, taste: e.target.value }))} /></div>
              <div className="form-group"><input type="text" placeholder="Lengde" value={form.length} onChange={(e) => setForm(p => ({ ...p, length: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">Kvalitet</label><div className="stars">{[1,2,3,4,5].map(s => {const cr = parseFloat(form.quality) || 0; return <span key={s} onClick={() => setForm(p => ({ ...p, quality: (cr === s ? s - 0.5 : s).toString() }))} style={{marginRight: '0.25rem'}}>{cr >= s ? '★' : cr === s - 0.5 ? '½' : '☆'}</span>;})}</div></div>
            </div>
            <div className="modal-footer">
              <button onClick={save} disabled={saving} className="btn-primary">{saving ? 'Lagrer...' : (editId ? 'Oppdater' : 'Legg til')}</button>
              {editId && <button onClick={() => { setShowForm(false); setEditId(null); del(editId); }} className="btn-danger">Slett</button>}
              <button onClick={() => { setShowForm(false); setEditId(null); resetForm(); }} className="btn-secondary">Avbryt</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
