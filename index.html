<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinkartotek</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(to bottom right, #faf5f0, #f3f4f6); min-height: 100vh; padding: 1.5rem; }
    .container { max-width: 80rem; margin: 0 auto; }
    .card { background: white; border-radius: 0.5rem; box-shadow: 0 10px 15px rgba(0,0,0,0.1); padding: 1.5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.875rem; font-weight: bold; margin-bottom: 1.5rem; }
    h2 { font-size: 1.25rem; font-weight: bold; margin: 1rem 0; }
    button { padding: 0.375rem 0.75rem; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; }
    .btn-primary { background: #374151; color: white; }
    .btn-primary:hover { background: #1f2937; }
    .btn-secondary { background: #4b5563; color: white; }
    .btn-gray { background: #d1d5db; color: #374151; }
    .btn-red { background: #dc2626; color: white; }
    .btn-blue { background: #2563eb; color: white; padding: 0.5rem 1rem; }
    input, select, textarea { width: 100%; padding: 0.375rem 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-size: 0.875rem; }
    .flex { display: flex; gap: 0.5rem; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
    .space-y > * + * { margin-top: 1rem; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; overflow: auto; }
    .modal-content { background: white; border-radius: 0.5rem; max-width: 48rem; width: 100%; overflow-y: auto; box-shadow: 0 20px 25px rgba(0,0,0,0.15); }
    .modal-header { padding: 0.75rem; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 0.75rem; }
    .modal-footer { padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; flex-direction: column; }
    .wine-card { background: white; border-radius: 0.5rem; box-shadow: 0 10px 15px rgba(0,0,0,0.1); padding: 0.75rem; cursor: pointer; }
    .wine-name { font-size: 1.125rem; font-weight: bold; }
    .wine-meta { font-size: 0.75rem; color: #6b7280; margin-top: 0.25rem; }
    .wine-actions { display: flex; gap: 0.5rem; }
    .tab-btn { padding: 0.375rem 0.75rem; border-radius: 0.375rem; border: none; cursor: pointer; }
    .tab-active { background: #374151; color: white; }
    .tab-inactive { background: #d1d5db; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    const SHEET_ID = '1QagDAoCbeuAneC0H37PhIVncqUxIslH8lrchBgyfhnA';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyX1qUO2jWSAynR65Ik5c35mp7dyWJMkSSQelRtbmFOyLGsYlS2_8jCoaLNUW9WZVA/exec';
    
    const formatDate = (dateValue) => {
      if (!dateValue) return '';
      if (typeof dateValue === 'string' && dateValue.includes('-')) return dateValue;
      return dateValue;
    };
    
    const toNorwegianDate = (dateString) => {
      if (!dateString) return '';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}.${month}.${year}`;
    };
    
    function App() {
      const [wines, setWines] = useState([]);
      const [view, setView] = useState('list');
      const [search, setSearch] = useState('');
      const [sortBy, setSortBy] = useState('newest');
      const [filterWineType, setFilterWineType] = useState('');
      const [filterQuality, setFilterQuality] = useState('');
      const [filterCountry, setFilterCountry] = useState('');
      const [showForm, setShowForm] = useState(false);
      const [showDetails, setShowDetails] = useState(false);
      const [selectedWine, setSelectedWine] = useState(null);
      const [editId, setEditId] = useState(null);
      const [saving, setSaving] = useState(false);
      const [loading, setLoading] = useState(false);
      const [form, setForm] = useState({
        name: '', url: '', wineType: '', dateTasted: new Date().toISOString().split('T')[0],
        country: '', region: '', subRegion: '', grapes: '',
        sightClarity: '', sightIntensity: '', sightColor: '',
        noseCondition: '', noseIntensity: '', noseAroma: '',
        sweetness: '', acid: '', tannin: '', body: '', taste: '', length: '', quality: ''
      });

      const checkPassword = () => {
        const authorized = localStorage.getItem('vinkartotek_auth');
        if (authorized === 'true') return true;
        const password = prompt('Passord påkrevd for å gjøre endringer:');
        if (password === 'Arteta') {
          localStorage.setItem('vinkartotek_auth', 'true');
          return true;
        }
        alert('Feil passord');
        return false;
      };

      useEffect(() => { loadData(); }, []);

      const loadData = async () => {
        setLoading(true);
        try {
          const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
          const t = await r.text();
          const j = JSON.parse(t.substring(47).slice(0, -2));
          const ws = j.table.rows.slice(0).map((row, i) => {
            let qualityValue = '';
            if (row.c[20]?.v !== null && row.c[20]?.v !== undefined) {
              qualityValue = String(row.c[20].v);
              if (qualityValue.startsWith("'")) qualityValue = qualityValue.substring(1);
            }
            return {
              id: i + 1,
              name: row.c[0]?.v || '', url: row.c[1]?.v || '', wineType: row.c[2]?.v || '',
              dateTasted: formatDate(row.c[3]?.v) || '', country: row.c[4]?.v || '', region: row.c[5]?.v || '',
              subRegion: row.c[6]?.v || '', grapes: row.c[7]?.v || '',
              sightClarity: row.c[8]?.v || '', sightIntensity: row.c[9]?.v || '', sightColor: row.c[10]?.v || '',
              noseCondition: row.c[11]?.v || '', noseIntensity: row.c[12]?.v || '', noseAroma: row.c[13]?.v || '',
              sweetness: row.c[14]?.v || '', acid: row.c[15]?.v || '', tannin: row.c[16]?.v || '',
              body: row.c[17]?.v || '', taste: row.c[18]?.v || '', length: row.c[19]?.v || '', quality: qualityValue
            };
          });
          setWines(ws);
        } catch (e) { alert('Feil: ' + e.message); }
        finally { setLoading(false); }
      };

      const save = async () => {
        if (!form.name) { alert('Navn påkrevd'); return; }
        setSaving(true);
        try {
          const body = editId ? {
            action: 'update',
            originalName: wines.find(w => w.id === editId).name,
            originalDate: wines.find(w => w.id === editId).dateTasted,
            ...form
          } : { action: 'add', ...form };
          
          const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
          const res = await r.json();
          
          if (res.success) {
            loadData();
            setShowForm(false);
            setEditId(null);
          } else alert('Feil: ' + res.message);
        } catch (e) { alert('Feil: ' + e.message); }
        finally { setSaving(false); }
      };

      const del = async (id) => {
        if (!checkPassword()) return;
        if (!confirm('Slette?')) return;
        try {
          const w = wines.find(x => x.id === id);
          const r = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'delete', name: w.name, dateTasted: w.dateTasted })
          });
          const res = await r.json();
          if (res.success) { loadData(); alert('Slettet!'); }
          else alert('Feil: ' + res.message);
        } catch (e) { alert('Feil: ' + e.message); }
      };

      const filtered = wines.filter(w => {
        const matchesSearch = Object.values(w).some(v => String(v).toLowerCase().includes(search.toLowerCase()));
        const matchesWineType = !filterWineType || w.wineType === filterWineType;
        const matchesQuality = !filterQuality || w.quality === filterQuality;
        const matchesCountry = !filterCountry || w.country === filterCountry;
        return matchesSearch && matchesWineType && matchesQuality && matchesCountry;
      });

      const uniqueCountries = [...new Set(wines.map(w => w.country).filter(Boolean))].sort();
      const uniqueQualities = [...new Set(wines.map(w => w.quality).filter(Boolean))].sort((a, b) => parseFloat(b) - parseFloat(a));

      const sorted = [...filtered].sort((a, b) => {
        if (sortBy === 'newest') {
          const dateA = new Date(a.dateTasted || 0);
          const dateB = new Date(b.dateTasted || 0);
          if (dateB.getTime() !== dateA.getTime()) return dateB - dateA;
          return b.id - a.id;
        }
        if (sortBy === 'quality') {
          const qa = parseFloat(a.quality) || 0;
          const qb = parseFloat(b.quality) || 0;
          return qb - qa;
        }
        return 0;
      });

      return (
        <div className="container">
          <div className="card">
            <div className="flex-between">
              <h1>🗂 Vinkartotek</h1>
              <div className="flex">
                <button className="btn-primary" onClick={() => { if (checkPassword()) setShowForm(true); }}>+</button>
                <button className="btn-secondary" onClick={() => { loadData(); }} disabled={loading}>↻</button>
              </div>
            </div>
            
            <div className="flex" style={{marginBottom: '1rem'}}>
              <button className={view === 'list' ? 'tab-btn tab-active' : 'tab-btn tab-inactive'} onClick={() => setView('list')}>Utforsk</button>
              <button className={view === 'stats' ? 'tab-btn tab-active' : 'tab-btn tab-inactive'} onClick={() => setView('stats')}>Statistikk</button>
            </div>

            {view === 'list' && (
              <div className="space-y">
                <input type="text" placeholder="Søk..." value={search} onChange={(e) => setSearch(e.target.value)} />
                <div className="grid-3">
                  <select value={filterWineType} onChange={(e) => setFilterWineType(e.target.value)}>
                    <option value="">Alle typer</option>
                    <option value="Rødvin">Rødvin</option>
                    <option value="Hvitvin">Hvitvin</option>
                    <option value="Rosévin">Rosévin</option>
                  </select>
                  <select value={filterQuality} onChange={(e) => setFilterQuality(e.target.value)}>
                    <option value="">Alle stjerner</option>
                    {uniqueQualities.map(q => <option key={q} value={q}>{q}★</option>)}
                  </select>
                  <select value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                    <option value="newest">Nyeste først</option>
                    <option value="quality">Kvalitet</option>
                  </select>
                </div>
                <select value={filterCountry} onChange={(e) => setFilterCountry(e.target.value)}>
                  <option value="">Alle land</option>
                  {uniqueCountries.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <button className="btn-gray" onClick={() => { setSearch(''); setFilterWineType(''); setFilterQuality(''); setFilterCountry(''); setSortBy('newest'); }}>Nullstill</button>
              </div>
            )}
          </div>

          {view === 'list' && (
            <div className="space-y">
              <p style={{textAlign: 'center', fontWeight: 'bold'}}>{sorted.length} viner</p>
              {sorted.map(w => (
                <div key={w.id} className="wine-card" onClick={() => { setSelectedWine(w); setShowDetails(true); }}>
                  <div className="wine-name">{w.name}</div>
                  <div className="wine-meta">{w.wineType} · {w.country} · {toNorwegianDate(w.dateTasted)}</div>
                  <div className="flex-between" style={{marginTop: '0.5rem'}}>
                    {w.quality && <span style={{fontSize: '1rem', fontWeight: 'bold'}}>{w.quality}★</span>}
                    <div className="wine-actions">
                      {w.url && <a href={w.url} target="_blank" style={{textDecoration: 'none'}}>🔗</a>}
                      <button className="btn-primary" onClick={(e) => { e.stopPropagation(); if (checkPassword()) { setForm(w); setEditId(w.id); setShowForm(true); } }}>✎</button>
                      <button className="btn-secondary" onClick={(e) => { e.stopPropagation(); del(w.id); }}>✕</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {view === 'stats' && <div className="card"><h2>Statistikk</h2><p style={{fontSize: '2rem', fontWeight: 'bold'}}>{wines.length}</p><p>Totalt viner</p></div>}

          {showDetails && selectedWine && (
            <div className="modal">
              <div className="modal-content">
                <div className="modal-header">
                  <h2>{selectedWine.name}</h2>
                  <button style={{background: 'none', border: 'none', fontSize: '1.5rem', cursor: 'pointer'}} onClick={() => setShowDetails(false)}>×</button>
                </div>
                <div className="modal-body">
                  {selectedWine.wineType && <p><strong>Type:</strong> {selectedWine.wineType}</p>}
                  {selectedWine.country && <p><strong>Land:</strong> {selectedWine.country}</p>}
                  {selectedWine.quality && <p><strong>Kvalitet:</strong> {selectedWine.quality}★</p>}
                </div>
                <div className="modal-footer">
                  <button className="btn-blue" onClick={() => { if (checkPassword()) { setForm(selectedWine); setEditId(selectedWine.id); setShowDetails(false); setShowForm(true); } }}>✎ Rediger</button>
                  <button className="btn-gray" onClick={() => setShowDetails(false)}>Lukk</button>
                </div>
              </div>
            </div>
          )}

          {showForm && (
            <div className="modal">
              <div className="modal-content">
                <div className="modal-header">
                  <h2>{editId ? 'Rediger' : 'Ny vin'}</h2>
                  <button style={{background: 'none', border: 'none', fontSize: '1.5rem', cursor: 'pointer'}} onClick={() => { setShowForm(false); setEditId(null); }}>×</button>
                </div>
                <div className="modal-body space-y">
                  <input type="text" placeholder="Vinnavn *" value={form.name} onChange={(e) => setForm(p => ({ ...p, name: e.target.value }))} />
                  <input type="url" placeholder="URL" value={form.url} onChange={(e) => setForm(p => ({ ...p, url: e.target.value }))} />
                  <select value={form.wineType} onChange={(e) => setForm(p => ({ ...p, wineType: e.target.value }))}>
                    <option value="">Type vin</option>
                    <option value="Rødvin">Rødvin</option>
                    <option value="Hvitvin">Hvitvin</option>
                  </select>
                  <input type="date" value={form.dateTasted} onChange={(e) => setForm(p => ({ ...p, dateTasted: e.target.value }))} />
                  <input type="text" placeholder="Land" value={form.country} onChange={(e) => setForm(p => ({ ...p, country: e.target.value }))} />
                  <input type="text" placeholder="Druer" value={form.grapes} onChange={(e) => setForm(p => ({ ...p, grapes: e.target.value }))} />
                  <div>
                    <label style={{fontSize: '0.875rem', fontWeight: '500'}}>Kvalitet</label>
                    <div className="flex">
                      {[1,2,3,4,5].map(s => {
                        const cr = parseFloat(form.quality) || 0;
                        return <span key={s} onClick={() => setForm(p => ({ ...p, quality: (cr === s ? s - 0.5 : s).toString() }))} style={{fontSize: '1.5rem', cursor: 'pointer'}}>{cr >= s ? '★' : cr === s - 0.5 ? '½' : '☆'}</span>;
                      })}
                    </div>
                  </div>
                </div>
                <div className="modal-footer">
                  <button className="btn-primary" onClick={save} disabled={saving}>{saving ? 'Lagrer...' : (editId ? 'Oppdater' : 'Legg til')}</button>
                  {editId && <button className="btn-red" onClick={() => { setShowForm(false); setEditId(null); del(editId); }}>Slett</button>}
                  <button className="btn-gray" onClick={() => { setShowForm(false); setEditId(null); }}>Avbryt</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
